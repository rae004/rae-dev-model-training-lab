[project]
name = "rae-model-training-research"
version = "0.1.0"
description = "Learning project: build, train, and fine-tune a small code-review language model"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "tensorboard>=2.18",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereview"]

# CPU-only PyTorch wheel for the build plane. CI (ubuntu-latest) and
# rae-dev-command are both CPU-only x86_64, so CPU wheels resolve for
# both. Training that needs CUDA rents a GPU per ADR-003/ADR-026 and
# installs torch inside a container, not in this lockfile. The workhorse
# itself used to pin a CUDA venv (ADR-014's cu126, then ADR-021's cu128,
# both now superseded by ADR-027's "Vulkan via Ollama, no local PyTorch"
# stance), but this lockfile was never where that pin lived.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
